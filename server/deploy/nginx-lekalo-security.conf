# Заголовки безопасности Лекало. Подключается через include в каждый server-блок
# (см. enable-security-headers.sh). HSTS здесь НЕТ намеренно — его ставит
# enable-https.sh прямо в HTTPS-блок; дублировать add_header нельзя.
#
# add_header на одном уровне (server) накапливаются, а location /api/ и location /
# своих add_header не имеют, поэтому наследуют эти. CSP с 'unsafe-inline' —
# на сайте инлайновые <script>/<style>; connect-src разрешает api.telegram.org
# (уведомление о регистрации из register.html) и свой источник (снапшот + /api).

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.telegram.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

server_tokens off;
