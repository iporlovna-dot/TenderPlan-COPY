# nginx: статический фронт из site/ + прокси на FastAPI (/api → uvicorn :8000).
# Положить в /etc/nginx/sites-available/lekalo, симлинк в sites-enabled, nginx -s reload.

server {
    listen 80;
    server_name _;  # HTTPS: bash deploy/enable-https.sh сам подставит домен (nip.io) и добавит 443+редирект

    root /opt/lekalo/site;
    index index.html;

    # статический фронт (лендинг, app.html, css, js, data)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → uvicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        client_max_body_size 25m;  # загрузка ТЗ на /api/match
    }
}
