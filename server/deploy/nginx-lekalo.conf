# nginx: статический фронт из site/ + прокси на FastAPI (/api → uvicorn :8000).
# Положить в /etc/nginx/sites-available/lekalo, симлинк в sites-enabled, nginx -s reload.
#
# Голый IP держим на отдельном простом HTTP-блоке (старые ссылки продолжают
# работать без сюрпризов) — сертификат для голого IP всё равно не бывает.
# bash deploy/enable-https.sh дописывает под него ОТДЕЛЬНЫЙ блок на nip.io-домен
# с HTTPS + редиректом HTTP→HTTPS (именно для этого домена, не для IP).

server {
    listen 80;
    server_name 186.246.30.213;

    root /opt/lekalo/site;
    index index.html;

    # вход/регистрация/кабинет — только по HTTPS (secure-cookie сессии по
    # голому HTTP браузер не сохранит, вход молча "не сработает")
    location ~ ^/(login|register|account)\.html$ {
        return 302 https://186.246.30.213.nip.io$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        client_max_body_size 25m;  # загрузка ТЗ на /api/match
    }
}
