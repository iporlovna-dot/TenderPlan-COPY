# Сетевые rate-лимиты Лекало (http-контекст). Кладётся в /etc/nginx/conf.d/,
# который include'ится внутрь http{}. Директивы limit_req/limit_conn, которые
# ссылаются на эти зоны, вставляет enable-ratelimit.sh в location /api/.
#
# Зачем: app-лимит (server/app/ratelimit.py) закрывает только вход/регистрацию/2FA.
# Всё остальное под /api/ (лента, поиски, кабинет) без сетевого лимита можно
# долбить и положить uvicorn. Здесь — грубый волюметрический предохранитель на IP.

# Средняя скорость 10 запросов/сек на IP (всплеск гасится burst в location).
# Живому пользователю (листание/поиск) хватает с запасом; флуд режется.
limit_req_zone $binary_remote_addr zone=lekalo_api:10m rate=10r/s;

# Одновременные соединения на IP — против висящих/медленных коннектов.
limit_conn_zone $binary_remote_addr zone=lekalo_conn:10m;

# Превышение отвечаем 429 (по умолчанию 503): честный код + удобно ловить fail2ban'ом.
limit_req_status 429;
limit_conn_status 429;
