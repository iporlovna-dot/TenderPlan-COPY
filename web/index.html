<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpecMatch — подбор госзакупок по характеристикам ТЗ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F5F2; --surface:#FFFFFF; --surface-2:#FAFBF8;
  --ink:#15171C; --ink-soft:#565E6B; --ink-faint:#8A919C;
  --line:#E5E7E1; --line-soft:#EEF0EA;
  --brand:#0F6E52; --brand-ink:#0A5540; --brand-soft:#E4F1EA;
  --ok:#15794F; --ok-bg:#E7F3EC; --warn:#8C5A06; --warn-bg:#FBF1DB;
  --bad:#B12A1E; --bad-bg:#FBE9E6; --info:#2A5BA8; --info-bg:#E9F0FB;
  --shadow-sm:0 1px 2px rgba(20,23,28,.04),0 1px 3px rgba(20,23,28,.06);
  --shadow-md:0 6px 20px -8px rgba(20,23,28,.18),0 2px 6px rgba(20,23,28,.06);
  --r-lg:16px; --r-md:12px; --r-sm:9px;
  --mono:'IBM Plex Mono',ui-monospace,monospace; --ui:'Onest',-apple-system,Segoe UI,Roboto,sans-serif;
  --topH:54px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0;height:100%}
body{font-family:var(--ui); color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.5}
.hidden{display:none !important}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:15px}
a{color:var(--brand-ink); text-decoration:none}
.mono{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}
.code{font-family:var(--mono); font-size:.9em}
::-webkit-scrollbar{width:9px;height:9px} ::-webkit-scrollbar-thumb{background:#D6D9D0;border-radius:9px;border:2px solid transparent;background-clip:content-box}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:0 20px;height:var(--topH);
  background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.02em;font-size:17px}
.brand .mark{width:21px;height:21px;border-radius:6px;background:linear-gradient(150deg,var(--brand),#1FA079);position:relative}
.brand .mark::after{content:"";position:absolute;inset:6px 6px auto auto;width:5px;height:5px;border-radius:50%;background:#E8FBF2}
.spacer{flex:1}
.whoami{display:flex;align-items:center;gap:12px;color:var(--ink-soft);font-size:13px}
.whoami b{color:var(--ink);font-weight:600}
.linkbtn{border:0;background:none;color:var(--ink-faint);font-weight:600;font-size:13px;padding:6px 8px;border-radius:7px}
.linkbtn:hover{color:var(--bad);background:var(--bad-bg)}

/* ---------- 3 columns ---------- */
.cols{display:grid;grid-template-columns:270px 400px 1fr;height:calc(100vh - var(--topH))}
.col{overflow-y:auto;height:100%}
.col-products{background:var(--surface-2);border-right:1px solid var(--line)}
.col-leads{background:var(--paper);border-right:1px solid var(--line)}
.col-detail{background:var(--surface)}
.col-h{position:sticky;top:0;z-index:5;background:inherit;border-bottom:1px solid var(--line);padding:13px 16px;display:flex;align-items:center;gap:10px}
.col-h .t{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint)}
.col-h .spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:28px;height:28px;font-size:16px;color:var(--brand-ink);display:grid;place-items:center;transition:.15s;flex:none}
.iconbtn:hover{background:var(--brand-soft);border-color:var(--brand-soft)}

/* product rows */
.prow{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;border-bottom:1px solid var(--line-soft);transition:.12s;position:relative}
.prow:hover{background:var(--line-soft)}
.prow.sel{background:var(--brand-soft)}
.prow.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
.prow .pn{flex:1;min-width:0;font-weight:600;font-size:14px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.prow .cnt{font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:1px 8px;min-width:26px;text-align:center}
.prow.sel .cnt{background:#fff;border-color:var(--brand-soft)}
.prow .cnt.attn{color:var(--warn);border-color:var(--warn-bg);background:var(--warn-bg)}
.prow .ed{opacity:0;border:0;background:none;color:var(--ink-faint);font-size:14px;padding:3px;border-radius:6px;transition:.12s}
.prow:hover .ed{opacity:1} .prow .ed:hover{color:var(--brand-ink);background:#fff}

/* lead rows */
.lrow{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:13px 16px;cursor:pointer;border-bottom:1px solid var(--line-soft);transition:.12s;position:relative;text-align:left;width:100%;background:none;border-left:0;border-top:0;border-right:0}
.lrow:hover{background:var(--surface-2)}
.lrow.sel{background:var(--surface)}
.lrow.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
.lrow .sc{font-variant-numeric:tabular-nums;font-weight:800;font-size:19px;letter-spacing:-.03em;line-height:1;padding-top:2px;width:44px}
.lrow .sc small{font-size:.55em;font-weight:700;opacity:.55}
.v-ok .sc{color:var(--ok)} .v-gap .sc{color:var(--warn)} .v-bad .sc{color:var(--bad)}
.lrow .lt{font-weight:600;font-size:13.5px;line-height:1.35;color:var(--ink);margin-bottom:5px}
.lrow .lm{display:flex;flex-wrap:wrap;gap:5px 11px;font-size:12px;color:var(--ink-soft);align-items:center}
.lrow .lm .mono{color:var(--ink)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%}
.dot.ok{background:var(--ok)} .dot.gap{background:var(--warn)} .dot.bad{background:var(--bad)}
.mini-attn{color:var(--warn);font-weight:700;font-size:11.5px}

/* filters row in middle */
.lfilters{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line-soft);background:var(--paper);position:sticky;top:47px;z-index:4}
.lfilters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 9px;font-size:13px;font-weight:600;color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:12.5px;color:var(--ink-soft);transition:.15s}
.chip:hover{border-color:var(--ink-faint)}
.chip.on{background:var(--warn);border-color:var(--warn);color:#fff}

/* empty states */
.empty{display:grid;place-items:center;height:100%;text-align:center;color:var(--ink-faint);padding:40px 24px}
.empty .ic{font-size:30px;margin-bottom:10px;opacity:.5}
.empty .big{font-size:14px;color:var(--ink-soft);font-weight:600;margin-bottom:4px}
.empty.sm{height:auto;padding:60px 20px}

/* ---------- detail pane ---------- */
.dpane{padding:0}
.dhead{padding:22px 28px 18px;border-bottom:1px solid var(--line)}
.dhead h2{margin:0 0 11px;font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.28}
.badges{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:7px;font-size:12.5px;font-weight:600}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.gap{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)} .badge.formal{background:var(--info-bg);color:var(--info)}
.badge.soft{background:var(--line-soft);color:var(--ink-soft)} .badge.attn{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px rgba(140,90,6,.25)}
.dbody{padding:22px 28px 60px;max-width:820px}
.notice{padding:11px 14px;border-radius:var(--r-sm);font-size:13.5px;font-weight:500;margin-bottom:20px}
.notice.attn{background:var(--warn-bg);color:var(--warn)} .notice.formal{background:var(--info-bg);color:var(--info)}
.section-t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.section-t .n{color:var(--ink);background:var(--line-soft);border-radius:6px;padding:0 7px;font-size:11px}
.facts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.fact{background:var(--surface);padding:11px 14px}
.fact .k{font-size:11.5px;color:var(--ink-faint);margin-bottom:3px}
.fact .val{font-size:14.5px;font-weight:600;color:var(--ink)}
.fact.wide{grid-column:1/-1}
.deadline-hot{color:var(--bad)}
.summary{display:flex;gap:16px;margin:4px 0 6px;font-size:13px}
.summary b{font-variant-numeric:tabular-nums}
.sum-ok{color:var(--ok)} .sum-bad{color:var(--bad)} .sum-gap{color:var(--warn)}

.check{display:flex;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line-soft)}
.check .ic{width:22px;height:22px;border-radius:7px;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.check.pass .ic{background:var(--ok-bg);color:var(--ok)} .check.violation .ic{background:var(--bad-bg);color:var(--bad)} .check.gap .ic{background:var(--warn-bg);color:var(--warn)}
.check .body{flex:1;min-width:0}
.check .rk{font-weight:600;font-size:14px;text-transform:capitalize}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:7px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:8px;overflow:hidden}
.cmp-col{background:var(--surface-2);padding:7px 11px;min-width:0}
.cmp-col .cl{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);margin-bottom:2px}
.cmp-col .cv{font-size:13.5px;color:var(--ink);word-break:break-word}
.cmp-col.mine{background:#fff}
.check.pass .cmp-col.mine .cv{color:var(--ok);font-weight:600}
.check.violation .cmp-col.mine .cv{color:var(--bad);font-weight:600}
.cmp-col.mine .cv.none{color:var(--warn);font-weight:500}
.fillrow{display:flex;gap:8px;margin-top:9px}
.fillrow input{flex:1;border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 11px;outline:none}
.fillrow input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;padding:9px 16px;border-radius:var(--r-sm);transition:.15s}
.btn:hover:not(:disabled){border-color:var(--ink-faint);background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--brand-ink)}
.expl{color:var(--ink-soft);font-size:14px;line-height:1.6;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin-top:8px}

/* ---------- product form (in right pane) ---------- */
.frow{display:flex;flex-direction:column;gap:5px;margin-bottom:16px}
.frow label{font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.frow .hint{font-weight:400;color:var(--ink-faint)}
.frow input{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;outline:none}
.frow input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.attr-row{display:grid;grid-template-columns:1fr 1fr 34px;gap:8px;margin-bottom:8px}
.attr-row input{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 11px;outline:none}
.attr-row input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.attr-row .rm{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);color:var(--ink-faint);font-size:16px}
.attr-row .rm:hover{color:var(--bad);border-color:var(--bad-bg);background:var(--bad-bg)}
.addrow{border:1px dashed var(--line);background:none;color:var(--ink-soft);font-weight:600;font-size:13.5px;padding:9px;border-radius:var(--r-sm);width:100%;transition:.15s}
.addrow:hover{border-color:var(--brand);color:var(--brand-ink);background:var(--brand-soft)}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-md);padding:38px 34px}
.auth .brand{font-size:22px;margin-bottom:14px}
.auth h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:20px 0 4px}
.auth p.lede{color:var(--ink-faint);font-size:14px;margin:0 0 24px}
.auth .btn.primary{width:100%;padding:12px;font-size:15px;margin-top:6px}
.auth .switch{text-align:center;margin-top:18px;font-size:13.5px;color:var(--ink-soft)}
.auth .switch button{border:0;background:none;color:var(--brand-ink);font-weight:700;padding:0}
.auth .err{background:var(--bad-bg);color:var(--bad);padding:10px 13px;border-radius:9px;font-size:13.5px;margin-bottom:16px}
.tagline{color:var(--ink-soft);font-size:14px;line-height:1.6;margin:0}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:12px 18px;border-radius:11px;font-size:14px;font-weight:500;box-shadow:var(--shadow-md);z-index:80;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)} .toast.err{background:var(--bad)}
@media(max-width:900px){.cols{grid-template-columns:1fr} .col-products,.col-leads{display:none} .facts{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="authScreen" class="auth">
  <div class="auth-card">
    <div class="brand"><span class="mark"></span>SpecMatch</div>
    <p class="tagline">Находим госзакупки под ваш товар по фактическим характеристикам ТЗ — а не по классификаторам.</p>
    <h1 id="authTitle">Вход в кабинет</h1>
    <p class="lede" id="authLede">Лента подходящих закупок, готовая к подаче.</p>
    <div id="authErr" class="err hidden"></div>
    <div class="frow" id="companyRow" style="display:none"><label>Название компании</label><input id="aCompany" type="text" placeholder="ООО «Медснаб»"></div>
    <div class="frow"><label>E-mail</label><input id="aEmail" type="email" placeholder="buyer@medsnab.ru"></div>
    <div class="frow"><label>Пароль</label><input id="aPass" type="password" placeholder="минимум 8 символов"></div>
    <button class="btn primary" id="authBtn" onclick="App.submitAuth()">Войти</button>
    <div class="switch" id="authSwitch">Ещё нет аккаунта? <button onclick="App.toggleAuth()">Зарегистрировать компанию</button></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="appScreen" class="hidden">
  <div class="topbar">
    <div class="brand"><span class="mark"></span>SpecMatch</div>
    <div class="spacer"></div>
    <div class="whoami"><span id="whoEmail"></span><button class="linkbtn" onclick="App.logout()">Выйти</button></div>
  </div>
  <div class="cols">
    <div class="col col-products">
      <div class="col-h"><span class="t">Товары</span><span class="spacer"></span><button class="iconbtn" title="Добавить товар" onclick="App.newProduct()">+</button></div>
      <div id="productList"></div>
    </div>
    <div class="col col-leads">
      <div class="col-h"><span class="t" id="leadsColTitle">Закупки</span><span class="spacer"></span><span class="t mono" id="leadsCount"></span></div>
      <div id="leadsFilters"></div>
      <div id="leadsList"></div>
    </div>
    <div class="col col-detail"><div id="detailPane"></div></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const API="";
const T={get a(){return localStorage.getItem('sm_access')},get r(){return localStorage.getItem('sm_refresh')},
  set(a,r){localStorage.setItem('sm_access',a);localStorage.setItem('sm_refresh',r)},
  clear(){['sm_access','sm_refresh','sm_email'].forEach(k=>localStorage.removeItem(k))}};

async function api(path,{method='GET',body,auth=true}={},_retry=false){
  const h={}; if(body!==undefined)h['Content-Type']='application/json'; if(auth&&T.a)h['Authorization']='Bearer '+T.a;
  const res=await fetch(API+path,{method,headers:h,body:body!==undefined?JSON.stringify(body):undefined});
  if(res.status===401&&auth&&!_retry&&T.r){const ok=await refresh(); if(ok)return api(path,{method,body,auth},true); App.logout(); throw new Error('Сессия истекла');}
  if(res.status===204)return null;
  const data=await res.json().catch(()=>({})); if(!res.ok)throw new Error(data.detail||('Ошибка '+res.status)); return data;
}
async function refresh(){try{const d=await api('/auth/refresh',{method:'POST',body:{refresh_token:T.r},auth:false});T.set(d.access_token,d.refresh_token);return true;}catch(e){return false;}}

const fmtMoney=v=>v==null?'—':new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(v)+' ₽';
const fmtDate=ms=>{if(!ms)return '—';const d=new Date(ms);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();};
const daysWord=n=>{if(n==null)return '';const a=Math.floor(Math.abs(n))%100,b=a%10;const w=a>10&&a<20?'дней':b===1?'день':b>1&&b<5?'дня':'дней';return Math.floor(n)+' '+w;};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const VMAP={eligible:['v-ok','ok','Проходит'],eligible_with_gaps:['v-gap','gap','С пробелами'],disqualified:['v-bad','bad','Не проходит']};
const plural=(n,a,b,c)=>{const x=Math.abs(n)%100,y=x%10;return x>10&&x<20?c:y===1?a:y>1&&y<5?b:c;};
function toast(m,e){const t=document.getElementById('toast');t.textContent=m;t.className='toast show'+(e?' err':'');setTimeout(()=>t.className='toast',2600);}

const App={
  regMode:false, editId:null, selProduct:null, selLead:null,
  _products:[], _leads:[], lf:{sort:'score',attn:false},

  init(){ T.a?this.enter():document.getElementById('authScreen').classList.remove('hidden'); },

  // ----- auth -----
  toggleAuth(){this.regMode=!this.regMode;const g=id=>document.getElementById(id);
    g('companyRow').style.display=this.regMode?'flex':'none';
    g('authTitle').textContent=this.regMode?'Регистрация компании':'Вход в кабинет';
    g('authLede').textContent=this.regMode?'Заведите компанию и первого пользователя.':'Лента подходящих закупок, готовая к подаче.';
    g('authBtn').textContent=this.regMode?'Создать компанию':'Войти';
    g('authSwitch').innerHTML=this.regMode?'Уже есть аккаунт? <button onclick="App.toggleAuth()">Войти</button>':'Ещё нет аккаунта? <button onclick="App.toggleAuth()">Зарегистрировать компанию</button>';
    g('authErr').classList.add('hidden');},
  async submitAuth(){const g=id=>document.getElementById(id);const email=g('aEmail').value.trim(),pass=g('aPass').value,company=g('aCompany').value.trim(),err=g('authErr');err.classList.add('hidden');
    try{const d=await api(this.regMode?'/auth/register':'/auth/login',{method:'POST',body:this.regMode?{email,password:pass,company_name:company}:{email,password:pass},auth:false});
      T.set(d.access_token,d.refresh_token);localStorage.setItem('sm_email',email);this.enter();}
    catch(e){err.textContent=e.message;err.classList.remove('hidden');}},
  async logout(){try{if(T.r)await api('/auth/logout',{method:'POST',body:{refresh_token:T.r},auth:false});}catch(e){}T.clear();location.reload();},

  enter(){document.getElementById('authScreen').classList.add('hidden');document.getElementById('appScreen').classList.remove('hidden');
    document.getElementById('whoEmail').innerHTML='<b>'+esc(localStorage.getItem('sm_email')||'')+'</b>';
    this.renderFilters(); this.loadProducts();},

  // ===== LEFT: products =====
  async loadProducts(){
    try{ const items=await api('/products'); this._products=items;
      const el=document.getElementById('productList');
      if(!items.length){ el.innerHTML='<div class="empty sm"><div class="ic">📦</div><div class="big">Товаров нет</div>Нажмите «+» вверху,<br>чтобы завести первый.</div>'; this.showEmptyLeads('Заведите товар, чтобы увидеть закупки'); this.showEmptyDetail(); return; }
      el.innerHTML=items.map(p=>`<div class="prow ${this.selProduct===p.id?'sel':''}" onclick="App.selectProduct(${p.id})">
        <span class="pn" title="${esc(p.name)}">${esc(p.name)}</span>
        <span class="cnt" id="cnt_${p.id}">·</span>
        <button class="ed" title="Изменить" onclick="event.stopPropagation();App.editProduct(${p.id})">✎</button></div>`).join('');
      items.forEach(p=>this.fetchCount(p.id));
      if(this.selProduct==null){ this.selectProduct(items[0].id); }
    }catch(e){ document.getElementById('productList').innerHTML='<div class="empty sm">'+esc(e.message)+'</div>'; }
  },
  async fetchCount(pid){ try{ const d=await api(`/products/${pid}/leads?limit=1`); const el=document.getElementById('cnt_'+pid); if(!el)return;
    const at=await api(`/products/${pid}/leads?limit=1&changed_only=true`);
    el.textContent=d.total; el.className='cnt'+(at.total>0?' attn':''); if(at.total>0)el.title=at.total+' с изменившимся ТЗ';
  }catch(e){} },

  selectProduct(id){ this.selProduct=id; this.selLead=null;
    const rows=document.getElementById('productList').querySelectorAll('.prow');
    this._products.forEach((p,i)=>{ if(rows[i]) rows[i].classList.toggle('sel', p.id===id); });
    const p=this._products.find(x=>x.id===id);
    document.getElementById('leadsColTitle').textContent=p?p.name:'Закупки';
    this.showEmptyDetail('Выберите закупку в списке');
    this.loadLeads(id);
  },

  // ===== MIDDLE: leads for product =====
  renderFilters(){ document.getElementById('leadsFilters').innerHTML=`<div class="lfilters">
      <select id="lfSort" onchange="App.lf.sort=this.value;App.loadLeads(App.selProduct)">
        <option value="score">По совпадению</option><option value="deadline">По сроку подачи</option><option value="updated">По обновлению</option></select>
      <button class="chip" id="lfAttn" onclick="App.lf.attn=!App.lf.attn;this.classList.toggle('on');App.loadLeads(App.selProduct)">❗ ТЗ изменилось</button>
    </div>`; },
  async loadLeads(pid){ if(pid==null)return; const list=document.getElementById('leadsList'); list.innerHTML='<div class="empty sm">Загрузка…</div>';
    const qs=`sort=${this.lf.sort}&limit=50&min_score=0`+(this.lf.attn?'&changed_only=true':'');
    try{ const page=await api(`/products/${pid}/leads?${qs}`); this._leads=page.items;
      document.getElementById('leadsCount').textContent=page.total+' '+plural(page.total,'закупка','закупки','закупок');
      if(!page.items.length){ list.innerHTML='<div class="empty sm"><div class="ic">🔍</div><div class="big">Подходящих закупок нет</div>По этому товару пока пусто'+(this.lf.attn?' (снимите фильтр «ТЗ изменилось»)':'')+'.</div>'; return; }
      list.innerHTML=page.items.map(l=>this.leadRow(l)).join('');
    }catch(e){ list.innerHTML='<div class="empty sm">'+esc(e.message)+'</div>'; }
  },
  leadRow(l){ const [vc,bc,bt]=VMAP[l.verdict]||['v-gap','gap','—']; const dl=l.days_left;
    const attn=l.change_status==='material'?'<span class="mini-attn">❗ ТЗ изменилось</span>':'';
    return `<button class="lrow ${vc} ${this.selLead===l.purchase_id?'sel':''}" onclick="App.selectLead('${encodeURIComponent(l.purchase_id)}')">
      <span class="sc">${l.score}<small>%</small></span>
      <span>
        <div class="lt">${esc(l.subject||'Без названия')}</div>
        <div class="lm"><span class="dot ${bc}"></span><span>${bt}</span>
          ${l.price!=null?`<span class="mono">${fmtMoney(l.price)}</span>`:''}
          ${dl!=null?`<span class="mono">${daysWord(dl)}</span>`:''}
          ${l.card&&l.card.smp?'<span>СМП</span>':''}${attn}</div>
      </span></button>`;
  },

  // ===== RIGHT: lead detail =====
  showEmptyLeads(msg){ document.getElementById('leadsList').innerHTML=`<div class="empty"><div class="ic">👈</div>${esc(msg||'Выберите товар')}</div>`; document.getElementById('leadsCount').textContent=''; },
  showEmptyDetail(msg){ document.getElementById('detailPane').innerHTML=`<div class="empty"><div class="ic">📄</div>${esc(msg||'Выберите закупку слева')}</div>`; },

  async selectLead(enc){ const purchase=decodeURIComponent(enc); this.selLead=purchase;
    document.querySelectorAll('.lrow').forEach(r=>r.classList.remove('sel'));
    this._leads.forEach((l,i)=>{ if(l.purchase_id===purchase){ const rows=document.querySelectorAll('.lrow'); if(rows[i])rows[i].classList.add('sel'); } });
    const pane=document.getElementById('detailPane'); pane.innerHTML='<div class="empty">Загрузка…</div>';
    try{ const d=await api(`/products/${this.selProduct}/leads/${encodeURIComponent(purchase)}`); this._detail=d; this.renderDetail(d); }
    catch(e){ pane.innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
  },
  renderDetail(d){ const [,bc,bt]=VMAP[d.verdict]||['','gap','—']; const c=d.card||{};
    const notice=d.change_status==='material'?`<div class="notice attn">❗ ${esc(d.change_note)}</div>`:d.change_status==='formal'?`<div class="notice formal">${esc(d.change_note)}</div>`:'';
    const money=v=>v==null?'—':fmtMoney(v);
    const fact=(k,v,cls='')=>`<div class="fact ${cls}"><div class="k">${k}</div><div class="val mono">${v}</div></div>`;
    const hot=c.days_to_submission!=null&&c.days_to_submission<=3?'deadline-hot':'';
    const cardHtml=`<div class="facts">
      ${fact('НМЦК',money(c.nmck))}
      ${fact('Срок подачи',`<span class="${hot}">${fmtDate(c.submission_close)}${c.days_to_submission!=null?' · '+daysWord(c.days_to_submission):''}</span>`)}
      ${fact('Проведение торгов',fmtDate(c.bidding_date))}
      ${fact('Подведение итогов',fmtDate(c.summing_up_date))}
      ${fact('Обеспечение заявки',money(c.guarantee_app))}
      ${fact('Обеспечение контракта',money(c.guarantee_contract))}
      ${c.execution_period?fact('Срок исполнения',esc(c.execution_period),'wide'):''}
      ${c.delivery_place?fact('Место поставки',esc(c.delivery_place),'wide'):''}
    </div>`;
    const chks=d.checks||[]; const pass=chks.filter(c=>c.status==='pass'),bad=chks.filter(c=>c.status==='violation'),gap=chks.filter(c=>c.status==='gap');
    const rowH=ch=>{ const map={pass:['pass','✓'],violation:['violation','✕'],gap:['gap','⚠']};const[cl,ic]=map[ch.status];const has=ch.product_value!=null&&ch.product_value!=='';
      const fill=ch.status==='gap'?`<div class="fillrow"><input type="text" data-fill="${esc(ch.req)}" placeholder="${esc(ch.action||'указать значение')}"><button class="btn primary" onclick="App.fillGap(this,'${esc(ch.req)}')">Указать</button></div>`:'';
      return `<div class="check ${cl}"><span class="ic">${ic}</span><div class="body"><div class="rk">${esc(ch.req).replace(/_/g,' ')}</div>
        <div class="cmp"><div class="cmp-col"><span class="cl">Требует ТЗ заказчика</span><span class="cv">${esc(ch.req_text||ch.req)}</span></div>
        <div class="cmp-col mine"><span class="cl">Ваш товар</span><span class="cv ${has?'':'none'}">${has?esc(ch.product_value):'нет данных'}</span></div></div>${fill}</div></div>`; };
    const sec=(title,arr,cls)=>arr.length?`<div class="section-t ${cls}">${title}<span class="n">${arr.length}</span></div>${arr.map(rowH).join('')}`:'';
    document.getElementById('detailPane').innerHTML=`<div class="dpane">
      <div class="dhead"><h2>${esc(d.subject||'Закупка')}</h2>
        <div class="badges"><span class="badge ${bc}">${bt} · ${d.score}%</span>
          ${c.reg_number?`<span class="badge soft code">№ ${esc(c.reg_number)}</span>`:''}
          ${c.customer?`<span class="badge soft">${esc(c.customer)}</span>`:''}
          ${c.href?`<a class="badge formal" href="${esc(c.href)}" target="_blank" rel="noopener">Открыть в ЕИС ↗</a>`:''}</div></div>
      <div class="dbody">
        ${notice}
        ${d.explanation?`<div class="expl">${esc(d.explanation)}</div>`:''}
        <div class="section-t">Карточка контракта</div>${cardHtml}
        <div class="summary"><span class="sum-ok">✓ Сошлось: <b>${pass.length}</b></span>${bad.length?`<span class="sum-bad">✕ Не сошлось: <b>${bad.length}</b></span>`:''}${gap.length?`<span class="sum-gap">⚠ На дозаполнение: <b>${gap.length}</b></span>`:''}</div>
        ${sec('❌ Не сошлось',bad)}
        ${sec('⚠ Обратить внимание — дозаполните',gap)}
        ${sec('✓ Сошлось',pass)}
      </div></div>`;
  },
  async fillGap(btn,key){ const inp=btn.parentElement.querySelector('input[data-fill]');const val=inp.value.trim();if(!val)return;
    try{ const d=await api(`/products/${this.selProduct}/leads/${encodeURIComponent(this.selLead)}/fill`,{method:'POST',body:{fills:{[key]:val}}});
      this._detail=d; this.renderDetail(d); toast('Пересчитано: '+d.score+'%'); this.loadLeads(this.selProduct); this.fetchCount(this.selProduct); }
    catch(e){ toast(e.message,true); }
  },

  // ===== product create/edit (in right pane) =====
  newProduct(){ this.editId=null; this.selLead=null; document.querySelectorAll('.lrow,.prow').forEach(r=>r.classList.remove('sel')); this.productForm(null); },
  editProduct(id){ const p=this._products.find(x=>x.id===id); if(!p)return; this.editId=id; this.selLead=null; this.productForm(p); },
  productForm(p){
    const rows=(p&&p.attributes&&p.attributes.length?p.attributes:[{key:'',value:''}]).map(a=>this.attrRow(a.key,a.value)).join('');
    document.getElementById('detailPane').innerHTML=`<div class="dpane"><div class="dhead"><h2>${p?'Изменить товар':'Новый товар'}</h2></div>
      <div class="dbody" style="max-width:640px">
        <div class="frow"><label>Название товара</label><input id="pName" value="${esc(p?p.name:'')}" placeholder="Перчатки смотровые нитриловые, неопудренные"></div>
        <div class="frow"><label>Артикул <span class="hint">— ваш внутренний код</span></label><input id="pKey" value="${esc(p?p.product_key:'')}" placeholder="gloves-nitrile-blue"></div>
        <div class="frow"><label>Коды КТРУ / ОКПД2 <span class="hint">— через запятую, по ним отсеиваем чужие закупки</span></label><input id="pKtru" value="${esc(p?(p.ktru||[]).join(', '):'')}" placeholder="32.50.13.190-00007689"></div>
        <div class="frow"><label>Характеристики <span class="hint">— по ним движок сверяет товар с требованиями ТЗ</span></label>
          <div id="attrRows">${rows}</div><button class="addrow" onclick="App.addAttrRow()">+ добавить характеристику</button></div>
        <div style="display:flex;gap:10px;margin-top:8px">
          <button class="btn primary" onclick="App.saveProduct()">${p?'Сохранить изменения':'Создать товар'}</button>
          <button class="btn" onclick="App.selProduct?App.selectProduct(App.selProduct):App.showEmptyDetail()">Отмена</button></div>
      </div></div>`;
  },
  attrRow(k='',v=''){ return `<div class="attr-row"><input placeholder="характеристика (напр. материал)" value="${esc(k)}"><input placeholder="значение (напр. нитрил)" value="${esc(v)}"><button class="rm" title="удалить" onclick="this.parentElement.remove()">×</button></div>`; },
  addAttrRow(){ document.getElementById('attrRows').insertAdjacentHTML('beforeend',this.attrRow()); },
  collectAttrs(){ const out=[]; document.querySelectorAll('#attrRows .attr-row').forEach(row=>{const ins=row.querySelectorAll('input');const k=ins[0].value.trim(),v=ins[1].value.trim();if(k)out.push({key:k.toLowerCase().replace(/\s+/g,'_'),value:v});});return out; },
  async saveProduct(){ const g=id=>document.getElementById(id); const name=g('pName').value.trim(),key=g('pKey').value.trim(),ktru=g('pKtru').value.split(',').map(s=>s.trim()).filter(Boolean),attrs=this.collectAttrs();
    if(!name||!key)return toast('Заполните название и артикул',true);
    const body={product_key:key,name,ktru,attributes:attrs};
    try{ let saved; if(this.editId){ saved=await api('/products/'+this.editId,{method:'PUT',body}); toast('Товар обновлён'); } else { saved=await api('/products',{method:'POST',body}); toast('Товар создан'); }
      this.selProduct=saved.id; await this.loadProducts(); this.selectProduct(saved.id);
    }catch(e){ toast(e.message,true); }
  },
};
App.init();
</script>
</body>
</html>
